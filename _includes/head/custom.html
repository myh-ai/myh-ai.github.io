<!-- Open external resources and PDFs in a new tab; keep internal navigation in place. -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var links = document.querySelectorAll('a[href]');
    for (var i = 0; i < links.length; i++) {
      var link = links[i];
      var href = link.getAttribute('href');
      if (!href || href.charAt(0) === '#' || href.indexOf('/#') !== -1) continue;
      if (/^(mailto:|tel:|javascript:)/i.test(href)) continue;

      try {
        var url = new URL(href, document.baseURI || window.location.href);
        var pageOrigin = new URL(document.baseURI || window.location.href).origin;
        var isExternal = url.origin !== pageOrigin;
        var isPdf = /\.pdf$/i.test(url.pathname);
        if (!isExternal && !isPdf) continue;

        if (!link.hasAttribute('target')) link.setAttribute('target', '_blank');
        var relTokens = (link.getAttribute('rel') || '').split(/\s+/).filter(Boolean);
        if (relTokens.indexOf('noopener') === -1) relTokens.push('noopener');
        if (relTokens.indexOf('noreferrer') === -1) relTokens.push('noreferrer');
        link.setAttribute('rel', relTokens.join(' '));
      } catch (err) {
        // Leave malformed or non-standard links untouched.
      }
    }
  });
</script>

<!-- gentle scroll-reveal for content sections (fails safe: content stays visible) -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    try {
      var els = document.querySelectorAll('.sn-home section');
      if (!els.length) return;
      for (var i = 0; i < els.length; i++) els[i].classList.add('sn-anim');
      if (!('IntersectionObserver' in window)) return;
      var vh = window.innerHeight || document.documentElement.clientHeight;
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          if (e.isIntersecting) { e.target.classList.remove('sn-hidden'); io.unobserve(e.target); }
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
      for (var j = 0; j < els.length; j++) {
        if (els[j].getBoundingClientRect().top > vh * 0.9) els[j].classList.add('sn-hidden');
        io.observe(els[j]);
      }
      setTimeout(function () {
        var h = document.querySelectorAll('.sn-home .sn-hidden');
        for (var k = 0; k < h.length; k++) h[k].classList.remove('sn-hidden');
      }, 2500);
    } catch (err) {
      var h = document.querySelectorAll('.sn-home .sn-hidden');
      for (var m = 0; m < h.length; m++) h[m].classList.remove('sn-hidden');
    }
  });
</script>
