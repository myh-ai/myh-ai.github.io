{% include base_path %}
<div class="site-footer__inner">
  <p class="site-footer__copyright">© {{ site.time | date: '%Y' }} {{ site.name | default: site.title }}.</p>
  <nav class="site-footer__profiles" aria-label="Academic profiles">
    {% if site.author.googlescholar %}<a href="{{ site.author.googlescholar }}" rel="me">Scholar</a>{% endif %}
    {% if site.author.orcid %}<a href="{{ site.author.orcid }}" rel="me">ORCID</a>{% endif %}
    {% if site.author.aclanthology %}<a href="{{ site.author.aclanthology }}" rel="me">ACL</a>{% endif %}
    {% if site.author.openreview %}<a href="{{ site.author.openreview }}" rel="me">OpenReview</a>{% endif %}
  </nav>
</div>
