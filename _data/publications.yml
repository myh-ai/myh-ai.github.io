  - title: "The Signal in the Noise: An Auditable Reliability Layer for Biomedical Text Classification"
    year: "2026"
    status: "Published"
    venue: "IEEE ICBCB 2026"
    note: "IEEE Xplore · corresponding author"
    summary: >-
      Builds a deterministic biomedical-NLP reliability layer with bounded correction,
      margin-based abstention, safety gates, and token-level decision traces.
