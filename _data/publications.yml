manuscripts:
  - title: "The Stereotype-Lock Effect: Over-Simulation and Variance Compression in LLM Simulated-Patient Personas"
    year: "2026"
    status: "Manuscript under review"
    summary: >-
      Audits LLM-simulated depression personas, revealing over-simulation and variance
      compressed to a fraction of the human clinical reference.
    links:
      - label: "Code"
        url: "https://github.com/myh-ai/Stereotype-Lock-tss_w"

  - title: "The Population-Geometry Gap: Patient Simulation that Looks Right Sentence-by-Sentence but Deforms as a Population"
    year: "2026"
    status: "Manuscript under review"
    summary: >-
      Shows that synthetic patient text can deform population-level geometry even when
      individual sentences look plausible, motivating geometry-level diagnosis.
    links:
      - label: "Code"
        url: "https://github.com/myh-ai/tss-w_PGG"
