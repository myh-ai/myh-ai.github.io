published:
  - title: "The Divergence Hypothesis: Unmasking Lexical Interference and Label Bias in Mental Health NLP"
    year: "2026"
    status: "Published"
    venue: "ACL BioNLP 2026"
    note: "Association for Computational Linguistics · pages 1–14"
    summary: >-
      Detects lexical interference and label-source bias in mental-health NLP classifiers
      through a white-box triple-stream probe and a difference-in-differences audit statistic.
